<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Dashboard</title>
    <!-- โหลดไลบรารี SheetJS สำหรับสร้างไฟล์ Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2.5em;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        button {
            padding: 12px 25px;
            border: 2px solid transparent;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:active { transform: scale(0.95); }
        .btn-generate { 
            background-color: #0ea5e9 !important;
            color: #ffffff !important; 
        }
        .btn-generate:hover { background-color: #0284c7 !important; }
        
        .btn-export {
            background-color: #10b981 !important; /* สีเขียวสำหรับ Excel */
            color: #ffffff !important;
        }
        .btn-export:hover { background-color: #059669 !important; }

        .btn-clear { 
            background-color: #ef4444 !important; 
            color: #ffffff !important; 
        }
        .btn-clear:hover { background-color: #dc2626 !important; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .card {
            background-color: #1e293b !important;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        .card-image-wrapper {
            width: 100%;
            height: 220px;
            background-color: #334155;
            position: relative;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .badge-country {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .card-content {
            padding: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card h3 {
            margin: 0 0 15px 0;
            color: #f8fafc !important;
            font-size: 1.5em;
        }
        .card .time {
            font-size: 0.9em;
            color: #94a3b8 !important;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        .empty-state {
            text-align: center;
            color: #64748b;
            grid-column: 1 / -1;
            padding: 80px 20px;
            font-size: 1.2em;
            background-color: #1e293b;
            border-radius: 16px;
            border: 2px dashed #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ สุ่มที่เที่ยว (Random Travel)</h1>
    <p class="subtitle">ระบบดึงข้อมูลและรูปภาพแบบสุ่ม จำลองการใช้งาน Cloud Storage</p>
    
    <div class="controls">
        <button class="btn-generate" onclick="generateData()">🎲 สุ่มสถานที่เที่ยวใหม่</button>
        <!-- เพิ่มปุ่มดาวน์โหลด Excel -->
        <button class="btn-export" onclick="exportToExcel()">📊 โหลดเป็น Excel</button>
        <button class="btn-clear" onclick="clearData()">🗑️ ล้างข้อมูล</button>
    </div>

    <div class="grid" id="dataGrid">
        <!-- ข้อมูลจะถูกโหลดมาที่นี่ -->
    </div>
</div>

<script>
    async function fetchData() {
        const response = await fetch('/api/data');
        const data = await response.json();
        
        const dataGrid = document.getElementById('dataGrid');
        dataGrid.innerHTML = ''; 

        if(data.length === 0) {
            dataGrid.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูล ลองกดปุ่ม <b>"สุ่มสถานที่เที่ยวใหม่"</b> ด้านบนดูสิ!</div>';
            return;
        }

        data.reverse().forEach(item => {
            const card = `
                <div class="card">
                    <div class="card-image-wrapper">
                        <img src="${item.imageUrl}" alt="${item.place}" onerror="this.style.display='none'">
                        <span class="badge-country">📍 ${item.country}</span>
                    </div>
                    <div class="card-content">
                        <h3>${item.place}</h3>
                        <div class="time">🕒 บันทึกเมื่อ: ${item.timestamp}</div>
                    </div>
                </div>
            `;
            dataGrid.innerHTML += card;
        });
    }

    async function generateData() {
        await fetch('/api/generate', { method: 'POST' });
        fetchData();
    }

    async function clearData() {
        await fetch('/api/data', { method: 'DELETE' });
        fetchData();
    }

    // ฟังก์ชันใหม่สำหรับดาวน์โหลดไฟล์ Excel (แบบมีรูปภาพจาก Server)
    function exportToExcel() {
        // ให้บราวเซอร์วิ่งไปโหลดไฟล์จาก API ที่เราเพิ่งสร้างใน server.js
        window.location.href = '/api/export';
    }

    fetchData();
</script>

</body>
</html>
